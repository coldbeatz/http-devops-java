# Server HTTP-port
server.port=8081

# Always include the error message in the HTTP error response body
server.error.include-message=always

# ==========================
#   H2 DATABASE SETTINGS
# ==========================

# JDBC URL for H2 database (file-based, stored in ./data/usersdb)
spring.datasource.url=jdbc:h2:file:./data/usersdb

# H2 database driver
spring.datasource.driver-class-name=org.h2.Driver

# H2 database username
spring.datasource.username=sa

# H2 database password (empty by default)
spring.datasource.password=

# ==========================
#   JPA / HIBERNATE SETTINGS
# ==========================

# Automatically update database schema based on JPA entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL output for better readability
spring.jpa.properties.hibernate.format_sql=true

# Highlight SQL statements in the logs (adds ANSI colors for better readability)
spring.jpa.properties.hibernate.highlight_sql=true
